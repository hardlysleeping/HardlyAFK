name: iOS compile check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'asbestos/**'
      - 'deps/**'
      - 'emu/**'
      - 'fs/**'
      - 'kernel/**'
      - 'platform/**'
      - 'util/**'
      - 'vdso/**'
      - 'iSH.xcodeproj/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'tests/host/test_product_identity.py'
      - '.github/workflows/ios-build.yml'

jobs:
  arm64-linux-shell:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ARM64 Linux reference runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang meson ninja-build pkg-config libsqlite3-dev libarchive-dev
          CC=clang make build-arm64-linux
      - name: Verify pinned Alpine rootfs and boot a disposable shell
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/alpine.tar.gz" \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.2-aarch64.tar.gz
          echo '9bf70a7f18ea44094cbb5f70c58f9af129c8214745743db0e68e5502cc2ce773  '"$RUNNER_TEMP/alpine.tar.gz" | sha256sum -c -
          ./build-arm64-linux/tools/fakefsify "$RUNNER_TEMP/alpine.tar.gz" "$RUNNER_TEMP/alpine-fakefs"
          timeout 90 ./build-arm64-linux/ish -f "$RUNNER_TEMP/alpine-fakefs" /bin/sh -c 'echo HardlyAFK-shell-ok; uname -m'

  unsigned-device-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install independent build tools
        run: brew install meson ninja
      - name: Check fork identity and rootfs importer
        run: |
          python3 -m unittest discover -s tests/host -p 'test_product_identity.py' -v
          make test-rootfs-download
      - name: Compile unsigned iOS device app (not installable)
        run: |
          xcodebuild -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Debug-ApplePleaseFixFB19282108 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HardlyAFK-DD" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build
      - name: Validate compiled product identity and rootfs
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          products = pathlib.Path(os.environ['RUNNER_TEMP']) / 'HardlyAFK-DD/Build/Products'
          apps = list(products.glob('*/HardlyAFK.app'))
          assert len(apps) == 1, apps
          app = apps[0]
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'ing.hardlysleep.HardlyAFK', info
          assert info['CFBundleDisplayName'] == 'HardlyAFK', info
          assert (app/'root.tar.gz').is_file(), 'bundled Alpine rootfs missing'
          print('Verified', app, info['CFBundleIdentifier'], info['CFBundleShortVersionString'])
          PY
      - name: Package unsigned app for inspection (not installable as-is)
        run: |
          APP="$RUNNER_TEMP/HardlyAFK-DD/Build/Products/Debug-ApplePleaseFixFB19282108-iphoneos/HardlyAFK.app"
          mkdir -p "$RUNNER_TEMP/hardlyafk-payload/Payload"
          ditto "$APP" "$RUNNER_TEMP/hardlyafk-payload/Payload/HardlyAFK.app"
          cd "$RUNNER_TEMP/hardlyafk-payload"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/HardlyAFK-unsigned.ipa"
          python3 - <<'PY'
          import os, plistlib, zipfile
          archive = os.path.join(os.environ['RUNNER_TEMP'], 'HardlyAFK-unsigned.ipa')
          with zipfile.ZipFile(archive) as ipa:
              info = plistlib.loads(ipa.read('Payload/HardlyAFK.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'ing.hardlysleep.HardlyAFK'
              assert 'Payload/HardlyAFK.app/root.tar.gz' in ipa.namelist()
              executable = ipa.read('Payload/HardlyAFK.app/' + info['CFBundleExecutable'])
              assert executable[:4] in (b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe'), 'not a Mach-O binary'
              print('Verified unsigned IPA:', len(ipa.namelist()), 'entries,', len(executable), 'executable bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HardlyAFK-unsigned-ipa
          path: ${{ runner.temp }}/HardlyAFK-unsigned.ipa
          if-no-files-found: error
